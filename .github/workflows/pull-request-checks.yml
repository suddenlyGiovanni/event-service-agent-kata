name: 🔗 Pull Request Checks
on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: 🎨 Lint (Source)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🧩 Install dependencies
        uses: ./.github/actions/setup

      - name: 🎨 Lint and format source code
        shell: sh
        run: |
          bun biome ci \
          --max-diagnostics=none \
          --reporter=github

  typecheck:
    name: 🔍 Typecheck (Source)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🧩 Install dependencies
        uses: ./.github/actions/setup

      - name: 🔍 Typecheck source code
        run: bun run type-check

  tests:
    name: 🧪 Tests (Source)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🧩 Install dependencies
        uses: ./.github/actions/setup

      - name: 🧪 Run source code tests
        run: bun run test --run

  documentation:
    name: 📚 ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: "JSDoc Formatting"
            emoji: "💅"
            command: |
              bun run format:docs:jsdoc
              if ! git diff --quiet; then
                echo "❌ JSDoc comments need formatting. Run: bun run format:docs:jsdoc"
                git diff --stat
                exit 1
              fi
          - name: "TSDoc Structure"
            emoji: "📚"
            command: "deno task docs:check"
          - name: "JSDoc Type-check"
            emoji: "📖"
            command: "deno task docs:type-check"
          - name: "Markdown Formatting"
            emoji: "📝"
            command: |
              bun run format:docs:markdown
              if ! git diff --quiet; then
                echo "❌ Markdown files need formatting. Run: bun run format:docs:markdown"
                git diff --stat
                exit 1
              fi
          - name: "Markdown Type-check"
            emoji: "📄"
            command: "deno task docs:type-check:md"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🧩 Install dependencies
        uses: ./.github/actions/setup

      - name: ${{ matrix.check.emoji }} ${{ matrix.check.name }}
        shell: sh
        run: ${{ matrix.check.command }}
